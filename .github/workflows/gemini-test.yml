name: Gemini Key Test

# TEMP: 一次性验证 GEMINI_API_KEY 在 runner 上能否调通、免费档模型是否可用。
# 验证完删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call Gemini chat completions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          key = os.environ["GEMINI_API_KEY"]
          print("key prefix:", key[:6], "len:", len(key))
          url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"

          def call(model):
              body = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "只回复：OK"}],
                  "max_tokens": 40,
              }).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      d = json.loads(r.read().decode())
                  ch = d["choices"][0]
                  return r.status, "content=%r finish=%s usage=%s" % (
                      ((ch.get("message") or {}).get("content") or "")[:40],
                      ch.get("finish_reason"), d.get("usage"))
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return -1, "%s: %s" % (type(e).__name__, e)

          for model in ("gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash"):
              for attempt in range(2):
                  st, msg = call(model)
                  print(model, "attempt", attempt, "->", st, msg)
                  if st == 200:
                      break
                  time.sleep(4)
          PY

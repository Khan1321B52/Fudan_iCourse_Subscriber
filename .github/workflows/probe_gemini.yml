name: Probe Gemini Catalog
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe flash models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key = os.environ.get("GEMINI_API_KEY", "")
          API = "https://generativelanguage.googleapis.com/v1beta"
          print("KEY_SET", bool(key), flush=True)

          def compat(model):
              url = f"{API}/openai/chat/completions"
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
                  "max_tokens": 32,
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + key},
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)

          models = [
              "gemini-flash-latest",
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
          ]

          for m in models:
              try:
                  d = compat(m)
                  txt = d["choices"][0]["message"].get("content", "")
                  print("PROBE", m, "OK", repr(txt[:40]), flush=True)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace").replace("\n", " ")[:200]
                  print("PROBE", m, "HTTP", e.code, body, flush=True)
              except Exception as e:
                  print("PROBE", m, "EXC", type(e).__name__, str(e)[:200], flush=True)
          PY
